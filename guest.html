<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Elite Jonrad Hotel - In-Room Guest Service (Room 304)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Official Eclipse Paho MQTT WebSocket Client (Never blocked, 100% reliable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <!-- React 18 & Babel Standalone via Cloudflare CDN (Global High-Speed & 100% Reliable Worldwide) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 20px 38px -10px rgba(184, 60, 31, 0.42);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 25px 46px -8px rgba(184, 60, 31, 0.58);
      }
    }
    @keyframes rippleWave {
      0% {
        opacity: 0.8;
        transform: scale(0.95);
      }
      100% {
        opacity: 0;
        transform: scale(1.45);
      }
    }
    .animate-bell-pulse {
      animation: subtlePulse 3.5s ease-in-out infinite;
    }
    .ripple-ring {
      position: absolute;
      inset: -14px;
      border-radius: 9999px;
      border: 2px solid rgba(220, 83, 51, 0.5);
      pointer-events: none;
      animation: rippleWave 1.4s cubic-bezier(0, 0.2, 0.8, 1) forwards;
    }
    .touch-press {
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .touch-press:active {
      transform: scale(0.96);
      filter: brightness(0.96);
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800 antialiased font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const MQTT_TOPIC = 'elite_jonrad_hotel_304_dispatch';

    const BROKERS = [
      { name: 'emqx', host: 'broker.emqx.io', port: 8084, path: '/mqtt' },
      { name: 'hivemq', host: 'broker.hivemq.com', port: 8884, path: '/mqtt' }
    ];

    function GuestApp() {
      const [isRippling, setIsRippling] = useState(false);
      const [alertInfo, setAlertInfo] = useState(null);
      const [activeRequest, setActiveRequest] = useState(() => {
        try {
          const saved = localStorage.getItem('elite_jonrad_guest_active_req');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [cloudStatus, setCloudStatus] = useState('connecting');
      const alertTimeoutRef = useRef(null);
      const clientsRef = useRef([]);

      // Handle staff acceptance notification on guest side
      const handleStaffAccepted = useCallback((payload) => {
        const attendant = (payload && payload.assignedTo) || 'Attendant Ana';
        setActiveRequest(prev => {
          const updated = {
            serviceItem: prev ? prev.serviceItem : 'In-Room Service',
            room: '304',
            status: 'dispatched',
            assignedTo: attendant,
            timestamp: new Date().toISOString()
          };
          try {
            localStorage.setItem('elite_jonrad_guest_active_req', JSON.stringify(updated));
          } catch (e) {}
          return updated;
        });

        // Show prominent "Your request dispatched" alert on guest phone!
        if (alertTimeoutRef.current) clearTimeout(alertTimeoutRef.current);
        setAlertInfo({
          type: 'dispatched',
          title: 'Your request dispatched',
          detail: `${attendant} has accepted your request and is en route to Room 304.`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        alertTimeoutRef.current = setTimeout(() => setAlertInfo(null), 12000);
      }, []);

      // Connect in parallel to Dual MQTT SSL WebSocket Brokers
      useEffect(() => {
        let isMounted = true;
        const activeClients = [];

        const startBrokerConnections = () => {
          if (typeof Paho === 'undefined' || !Paho.MQTT) {
            setTimeout(startBrokerConnections, 400);
            return;
          }

          BROKERS.forEach(b => {
            try {
              const clientId = `guest_${b.name}_${Math.random().toString(16).substring(2, 8)}`;
              const client = new Paho.MQTT.Client(b.host, b.port, b.path, clientId);

              const doConnect = () => {
                if (!isMounted) return;
                client.connect({
                  useSSL: true,
                  timeout: 6,
                  keepAliveInterval: 30,
                  cleanSession: true,
                  onSuccess: () => {
                    if (isMounted) {
                      setCloudStatus('connected');
                      try { client.subscribe(MQTT_TOPIC, { qos: 1 }); } catch (e) {}
                    }
                  },
                  onFailure: () => {
                    if (isMounted) {
                      setTimeout(doConnect, 4000);
                    }
                  }
                });
              };

              client.onConnectionLost = () => {
                if (isMounted) {
                  const anyConnected = activeClients.some(c => {
                    try { return c.isConnected(); } catch (e) { return false; }
                  });
                  setCloudStatus(anyConnected ? 'connected' : 'reconnecting');
                  setTimeout(doConnect, 2500);
                }
              };

              client.onMessageArrived = (message) => {
                try {
                  const payload = JSON.parse(message.payloadString);
                  if (payload.type === 'ACCEPT_REQUEST') {
                    handleStaffAccepted(payload);
                  }
                } catch (e) {}
              };

              doConnect();
              activeClients.push(client);
            } catch (e) {}
          });

          clientsRef.current = activeClients;
        };

        startBrokerConnections();

        // Local storage and BroadcastChannel listener for same-device cross-tab testing
        let bc = null;
        if (typeof BroadcastChannel !== 'undefined') {
          bc = new BroadcastChannel('elite_jonrad_hotel_bus');
          bc.onmessage = (e) => {
            if (e.data && e.data.type === 'ACCEPT_REQUEST') {
              handleStaffAccepted(e.data);
            }
          };
        }

        const handleStorage = (e) => {
          if (e.key === 'elite_jonrad_dispatch_event' && e.newValue) {
            try {
              const parsed = JSON.parse(e.newValue);
              handleStaffAccepted(parsed);
            } catch (err) {}
          }
          if (e.key === 'elite_jonrad_guest_active_req' && e.newValue) {
            try {
              setActiveRequest(JSON.parse(e.newValue));
            } catch (err) {}
          }
        };
        window.addEventListener('storage', handleStorage);

        return () => {
          isMounted = false;
          window.removeEventListener('storage', handleStorage);
          if (bc) bc.close();
          activeClients.forEach(c => {
            try { if (c.isConnected()) c.disconnect(); } catch (e) {}
          });
        };
      }, [handleStaffAccepted]);

      const triggerCall = (serviceItem, category, department, note) => {
        const reqId = `req-${Date.now()}`;
        const newReq = {
          id: reqId,
          room: '304',
          roomType: 'Executive King Room',
          floor: 'Floor 3',
          guestName: 'Alexander Wright (VIP)',
          serviceItem,
          category: category || 'Guest Request',
          department: department || 'Floor Captain',
          urgency: 'high',
          status: 'pending',
          timestamp: new Date().toISOString(),
          assignedTo: 'Unassigned',
          notes: note || 'Direct in-room dispatch from Room 304 tablet.',
          icon: serviceItem.includes('Water') ? '💧' : serviceItem.includes('Towel') ? '🧖' : serviceItem.includes('Bill') ? '🧾' : serviceItem.includes('AC') ? '🔧' : serviceItem.includes('Clean') ? '🧹' : '🛎️'
        };

        // Set active request to submitted
        const reqState = {
          id: reqId,
          serviceItem,
          status: 'submitted',
          timestamp: new Date().toISOString()
        };
        setActiveRequest(reqState);
        try {
          localStorage.setItem('elite_jonrad_guest_active_req', JSON.stringify(reqState));
        } catch (e) {}

        const payload = { type: 'NEW_REQUEST', request: newReq };
        const payloadStr = JSON.stringify(payload);

        // 1. Dual-Broker Parallel Broadcast (Reaches Staff Laptop Instantly on both brokers)
        clientsRef.current.forEach(c => {
          try {
            if (c && c.isConnected()) {
              const msg = new Paho.MQTT.Message(payloadStr);
              msg.destinationName = MQTT_TOPIC;
              msg.qos = 1;
              c.send(msg);
            }
          } catch (e) {}
        });

        // 2. Local storage & BroadcastChannel fallback (for same-device tabs)
        try {
          const existing = JSON.parse(localStorage.getItem('elite_jonrad_requests') || '[]');
          localStorage.setItem('elite_jonrad_requests', JSON.stringify([newReq, ...existing]));
          localStorage.setItem('elite_jonrad_staff_ringing', 'true');

          if (typeof BroadcastChannel !== 'undefined') {
            const bc = new BroadcastChannel('elite_jonrad_hotel_bus');
            bc.postMessage(payload);
          }
        } catch (e) {}

        // Visual tactile ripple
        setIsRippling(true);
        setTimeout(() => setIsRippling(false), 1400);

        // 3. SHOW GUEST SIDE ALERT: "Your request submitted"
        if (alertTimeoutRef.current) clearTimeout(alertTimeoutRef.current);
        setAlertInfo({
          type: 'submitted',
          title: 'Your request submitted',
          detail: `Your request for "${serviceItem}" has been submitted to Floor 3 Staff Desk.`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        alertTimeoutRef.current = setTimeout(() => setAlertInfo(null), 10000);
      };

      return (
        <div className="bg-[#F8F9FA] text-slate-800 antialiased font-sans min-h-screen flex flex-col justify-between selection:bg-amber-100">
          <main className="w-full max-w-md mx-auto flex-1 flex flex-col justify-between px-4 pb-4 pt-4">
            
            {/* Header */}
            <header className="pt-2 pb-2">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-[#091A36] text-amber-200 flex items-center justify-center font-serif text-sm font-semibold shadow-sm border border-amber-300/30">
                    EJ
                  </div>
                  <div>
                    <h1 className="text-[11px] uppercase tracking-wider font-semibold text-slate-500">
                      ELITE JONRAD HOTEL
                    </h1>
                    <p className="text-sm font-bold text-slate-900 leading-tight">
                      Hotel &amp; Suites Luxury Concierge
                    </p>
                  </div>
                </div>

                {/* Connection Status Badge */}
                <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ECFDF5] border border-emerald-200/80">
                  <span className={`w-2 h-2 rounded-full ${cloudStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="text-[11px] font-semibold text-emerald-700 tracking-tight">
                    {cloudStatus === 'connected' ? 'Staff Terminal Ready' : 'Connecting...'}
                  </span>
                </div>
              </div>

              {/* Room Card */}
              <div className="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)] flex items-center justify-between mt-2.5">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-900 flex items-center justify-center font-bold text-base border border-blue-100">
                    304
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-semibold text-slate-900">Executive King Room</span>
                      <span className="text-[10px] text-slate-400">• Floor 3</span>
                    </div>
                    <p className="text-[11px] text-slate-500">
                      Est. Housekeeping response: <span className="text-emerald-600 font-medium">&lt; 6 mins</span>
                    </p>
                  </div>
                </div>

                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-500">
                  <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                  </svg>
                </div>
              </div>

              {/* Live Request Status Tracker Card */}
              {activeRequest && (
                <div
                  className={`rounded-2xl p-3.5 mt-2.5 border-2 shadow-sm transition-all duration-300 flex items-center justify-between ${
                    activeRequest.status === 'dispatched'
                      ? 'bg-emerald-50/95 border-emerald-400 text-emerald-950'
                      : 'bg-amber-50/95 border-amber-300 text-amber-950'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <div
                      className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0 ${
                        activeRequest.status === 'dispatched'
                          ? 'bg-emerald-100 text-emerald-700'
                          : 'bg-amber-100 text-amber-700'
                      }`}
                    >
                      {activeRequest.status === 'dispatched' ? '🚀' : '🟡'}
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] font-extrabold uppercase tracking-wider">
                          {activeRequest.status === 'dispatched'
                            ? 'Your Request Dispatched'
                            : 'Your Request Submitted'}
                        </span>
                        <span
                          className={`w-2 h-2 rounded-full ${
                            activeRequest.status === 'dispatched'
                              ? 'bg-emerald-500 animate-pulse'
                              : 'bg-amber-500 animate-ping'
                          }`}
                        ></span>
                      </div>
                      <p className="text-xs font-bold text-slate-900 mt-0.5">
                        {activeRequest.serviceItem}
                      </p>
                      <p className="text-[10px] text-slate-500 mt-0.5">
                        {activeRequest.status === 'dispatched'
                          ? `${activeRequest.assignedTo || 'Attendant Ana'} en route to Room 304`
                          : 'Staff laptop terminal is ringing now • Waiting for dispatch'}
                      </p>
                    </div>
                  </div>

                  <span
                    className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full border ${
                      activeRequest.status === 'dispatched'
                        ? 'bg-emerald-200 text-emerald-900 border-emerald-400'
                        : 'bg-amber-200 text-amber-900 border-amber-400'
                    }`}
                  >
                    {activeRequest.status === 'dispatched' ? 'Dispatched' : 'Submitted'}
                  </span>
                </div>
              )}
            </header>

            {/* Hero Section */}
            <section className="my-auto py-4 flex flex-col items-center justify-center text-center relative">
              {isRippling && <div className="ripple-ring" />}

              <button
                onClick={() => triggerCall('Call Housekeeper', 'Housekeeping', 'Housekeeping Desk', 'High-priority instant chime from Room 304.')}
                className="touch-press animate-bell-pulse relative w-56 h-56 rounded-full bg-gradient-to-b from-[#DC5333] via-[#C84B31] to-[#A3341C] text-white flex flex-col items-center justify-center shadow-2xl border-[3px] border-[#FF987A]/30 focus:outline-none select-none cursor-pointer"
              >
                <div className="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mb-1">
                  <span className="text-5xl">🛎️</span>
                </div>
                <h2 className="text-lg font-bold tracking-tight text-white mt-1">
                  Call Housekeeper
                </h2>
                <p className="text-[11px] text-white/80 font-medium tracking-wide uppercase mt-0.5">
                  Rings Staff Terminal
                </p>
              </button>

              <div className="mt-6 flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-slate-200/80 shadow-xs">
                <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span className="text-xs text-slate-600 font-medium">
                  One-touch instant staff dispatch
                </span>
              </div>
            </section>

            {/* Quick Requests */}
            <section className="pt-2 pb-4">
              <div className="flex items-center justify-between mb-3 px-1">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                  Instant Essentials
                </h3>
                <span className="text-[11px] font-semibold text-slate-400">Room 304</span>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <button
                  onClick={() => triggerCall('Bottled Water (2x Still)', 'Room Service', 'Room Service', 'Guest requested chilled water.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg shrink-0">
                    💧
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">Bottled Water</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">2x Chilled Waters</p>
                  </div>
                </button>

                <button
                  onClick={() => triggerCall('Extra Bath Towels', 'Housekeeping', 'Housekeeping Desk', '2x plush bath sheets.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg shrink-0">
                    🧖
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">Fresh Towels</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">Plush Bath Sheets</p>
                  </div>
                </button>

                <button
                  onClick={() => triggerCall('Clean My Room', 'Housekeeping', 'Housekeeping Desk', 'Full room refresh requested.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg shrink-0">
                    🧹
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">Clean My Room</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">Linens &amp; Turndown</p>
                  </div>
                </button>

                <button
                  onClick={() => triggerCall('AC / Tech Check', 'Maintenance', 'Engineering Tech', 'Thermostat adjustment.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg shrink-0">
                    🔧
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">AC &amp; Tech Help</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">Engineering Staff</p>
                  </div>
                </button>
              </div>
            </section>

            {/* Top Floating Alert Banner: "Your request submitted" & "Your request dispatched" */}
            {alertInfo && (
              <div
                className={`fixed top-4 left-4 right-4 max-w-md mx-auto z-50 p-4 rounded-2xl shadow-2xl border-2 flex items-start justify-between gap-3 animate-in slide-in-from-top-4 duration-300 ${
                  alertInfo.type === 'dispatched'
                    ? 'bg-[#064E3B] text-white border-emerald-400'
                    : 'bg-[#091A36] text-white border-amber-400'
                }`}
              >
                <div
                  className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0 border ${
                    alertInfo.type === 'dispatched'
                      ? 'bg-emerald-500/20 text-emerald-200 border-emerald-400/40'
                      : 'bg-amber-400/20 text-amber-300 border-amber-400/30'
                  }`}
                >
                  {alertInfo.type === 'dispatched' ? '🚀' : '🛎️'}
                </div>
                <div className="flex-1">
                  <div className="flex items-center gap-2">
                    <span
                      className={`text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 rounded-full font-mono ${
                        alertInfo.type === 'dispatched'
                          ? 'bg-emerald-400 text-emerald-950 font-black'
                          : 'bg-amber-400 text-slate-950 font-black'
                      }`}
                    >
                      {alertInfo.type === 'dispatched' ? 'DISPATCHED' : 'SUBMITTED'}
                    </span>
                    <span className="text-[10px] text-slate-300 font-medium">Room 304</span>
                  </div>
                  <h4 className="text-sm font-bold text-white mt-1 leading-snug">
                    {alertInfo.title}
                  </h4>
                  <p className="text-xs text-slate-200 mt-0.5 leading-relaxed">
                    {alertInfo.detail}
                  </p>
                </div>
                <button
                  onClick={() => setAlertInfo(null)}
                  className="text-slate-300 hover:text-white text-sm px-2 py-1 cursor-pointer"
                >
                  ✕
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GuestApp />);
  </script>
</body>
</html>
