<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Elite Jonrad Hotel - Staff Operations & Dispatch Terminal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo, useCallback } = React;

    const DEFAULT_REQUESTS = [
      {
        id: 'req-304-bell',
        room: '304',
        roomType: 'Executive King Room',
        floor: 'Floor 3',
        guestName: 'Alexander Wright (VIP)',
        serviceItem: 'Call Housekeeper',
        category: 'Housekeeping',
        department: 'Housekeeping Desk',
        urgency: 'high',
        status: 'pending',
        timestamp: new Date(Date.now() - 1000 * 60 * 2).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'In-room chime rung via luxury concierge tablet.',
        icon: '🛎️'
      },
      {
        id: 'req-304-water',
        room: '304',
        roomType: 'Executive King Room',
        floor: 'Floor 3',
        guestName: 'Alexander Wright (VIP)',
        serviceItem: 'Bottled Water (2x Still)',
        category: 'Room Service',
        department: 'Room Service',
        urgency: 'medium',
        status: 'dispatched',
        timestamp: new Date(Date.now() - 1000 * 60 * 8).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'Chilled waters requested.',
        icon: '💧'
      },
      {
        id: 'req-312-clean',
        room: '312',
        roomType: 'Deluxe Sea View Suite',
        floor: 'Floor 3',
        guestName: 'Elena Rostova',
        serviceItem: 'Clean My Room',
        category: 'Housekeeping',
        department: 'Housekeeping Desk',
        urgency: 'low',
        status: 'dispatched',
        timestamp: new Date(Date.now() - 1000 * 60 * 18).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'Fresh linens requested.',
        icon: '🧹'
      },
      {
        id: 'req-308-ac',
        room: '308',
        roomType: 'Terrace Junior Suite',
        floor: 'Floor 3',
        guestName: 'Marcus Vance',
        serviceItem: 'AC / Tech Check',
        category: 'Maintenance',
        department: 'Engineering Tech',
        urgency: 'medium',
        status: 'dispatched',
        timestamp: new Date(Date.now() - 1000 * 60 * 24).toISOString(),
        assignedTo: 'Tech Mike',
        notes: 'Thermostat reading 24C, requested adjustment to 20C.',
        icon: '🔧'
      },
      {
        id: 'req-301-towels',
        room: '301',
        roomType: 'Superior Queen',
        floor: 'Floor 3',
        guestName: 'Sophia Lin',
        serviceItem: 'Extra Bath Towels',
        category: 'Housekeeping',
        department: 'Housekeeping Desk',
        urgency: 'low',
        status: 'completed',
        timestamp: new Date(Date.now() - 1000 * 60 * 45).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'Delivered 2x plush bath sheets.',
        icon: '🧖'
      }
    ];

    function StaffApp() {
      const [requests, setRequests] = useState(() => {
        try {
          const saved = localStorage.getItem('elite_jonrad_requests');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return DEFAULT_REQUESTS;
      });

      const [isStaffRinging, setIsStaffRinging] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [activeTab, setActiveTab] = useState('incoming');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [noteInputId, setNoteInputId] = useState(null);
      const [noteText, setNoteText] = useState('');
      const [quickNotice, setQuickNotice] = useState(null);

      const audioContextRef = useRef(null);
      const ringIntervalRef = useRef(null);

      // Initialize or resume Web Audio API Context
      const ensureAudio = useCallback(() => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!audioContextRef.current) {
            audioContextRef.current = new AudioCtx();
          }
          if (audioContextRef.current.state === 'suspended') {
            audioContextRef.current.resume();
          }
          return audioContextRef.current;
        } catch (e) {
          return null;
        }
      }, []);

      // Unlock browser audio upon any user gesture
      useEffect(() => {
        const unlock = () => ensureAudio();
        window.addEventListener('click', unlock);
        window.addEventListener('pointerdown', unlock);
        window.addEventListener('touchstart', unlock);
        window.addEventListener('keydown', unlock);
        return () => {
          window.removeEventListener('click', unlock);
          window.removeEventListener('pointerdown', unlock);
          window.removeEventListener('touchstart', unlock);
          window.removeEventListener('keydown', unlock);
        };
      }, [ensureAudio]);

      // Dynamic Title Flashing when incoming call rings
      useEffect(() => {
        let origTitle = 'Elite Jonrad Hotel - Staff Operations & Dispatch Terminal';
        let flashTimer = null;
        if (isStaffRinging) {
          let toggle = false;
          flashTimer = setInterval(() => {
            toggle = !toggle;
            document.title = toggle
              ? '🚨 (1) GUEST CALL RINGING! - Room 304'
              : '🔔 INCOMING GUEST REQUEST - Elite Jonrad';
          }, 750);
        } else {
          document.title = origTitle;
        }
        return () => {
          if (flashTimer) clearInterval(flashTimer);
          document.title = origTitle;
        };
      }, [isStaffRinging]);

      // Play double brass desk chime
      const playSingleBellChime = useCallback(() => {
        if (!soundEnabled) return;
        try {
          const ctx = ensureAudio();
          if (!ctx) return;

          const now = ctx.currentTime;
          [2093, 2637, 3135].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.24 / (idx + 1), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.95);
          });

          [1760, 2093, 2793].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now + 0.22);
            gain.gain.setValueAtTime(0.28 / (idx + 1), now + 0.22);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + 0.22);
            osc.stop(now + 1.45);
          });
        } catch (err) {}
      }, [soundEnabled, ensureAudio]);

      const startRinging = useCallback(() => {
        setIsStaffRinging(true);
        playSingleBellChime();
        if (ringIntervalRef.current) clearInterval(ringIntervalRef.current);
        ringIntervalRef.current = setInterval(() => {
          playSingleBellChime();
        }, 1800);
      }, [playSingleBellChime]);

      const stopRinging = useCallback(() => {
        setIsStaffRinging(false);
        if (ringIntervalRef.current) {
          clearInterval(ringIntervalRef.current);
          ringIntervalRef.current = null;
        }
        try {
          localStorage.setItem('elite_jonrad_staff_ringing', 'false');
        } catch (e) {}
      }, []);

      // Central Cloud Payload Handler
      const handleCloudPayload = useCallback((payload) => {
        if (!payload) return;
        if (typeof payload === 'string') {
          try { payload = JSON.parse(payload); } catch (e) {}
        }
        if (!payload || typeof payload !== 'object') return;

        if (payload.type === 'NEW_REQUEST' && payload.request) {
          setRequests(prev => {
            if (prev.some(r => r.id === payload.request.id)) return prev;
            return [payload.request, ...prev];
          });
          // Ring immediately on staff laptop
          startRinging();
        } else if (payload.type === 'ACCEPT_REQUEST' && payload.id) {
          setRequests(prev =>
            prev.map(r => r.id === payload.id ? { ...r, status: 'dispatched', assignedTo: payload.assignedTo || 'Attendant Ana' } : r)
          );
          stopRinging();
        }
      }, [startRinging, stopRinging]);

      // ================= BULLETPROOF REAL-TIME RECEIVER (SSE + WS + 1s SHORT-POLL) =================
      useEffect(() => {
        // Local storage listener
        const handleStorage = (e) => {
          if (e.key === 'elite_jonrad_requests' && e.newValue) {
            try { setRequests(JSON.parse(e.newValue)); } catch (err) {}
          }
          if (e.key === 'elite_jonrad_staff_ringing') {
            if (e.newValue === 'true') startRinging();
            else if (e.newValue === 'false') stopRinging();
          }
        };
        window.addEventListener('storage', handleStorage);

        let bc = null;
        if (typeof BroadcastChannel !== 'undefined') {
          bc = new BroadcastChannel('elite_jonrad_hotel_bus');
          bc.onmessage = (e) => {
            if (e.data) handleCloudPayload(e.data);
          };
        }

        // 1. Server-Sent Events (SSE)
        let eventSource = null;
        try {
          eventSource = new EventSource('https://ntfy.sh/elite_jonrad_hotel_304_dispatch/sse');
          eventSource.onmessage = (event) => {
            try {
              const raw = JSON.parse(event.data);
              if (raw.event === 'message' && raw.message) {
                let payload = null;
                try { payload = JSON.parse(raw.message); } catch (e) { payload = raw.message; }
                handleCloudPayload(payload);
              }
            } catch (err) {}
          };
        } catch (err) {}

        // 2. Parallel WebSocket (sub-50ms latency)
        let ws = null;
        try {
          ws = new WebSocket('wss://ntfy.sh/elite_jonrad_hotel_304_dispatch/ws');
          ws.onmessage = (event) => {
            try {
              const raw = JSON.parse(event.data);
              if (raw.event === 'message' && raw.message) {
                let payload = null;
                try { payload = JSON.parse(raw.message); } catch (e) { payload = raw.message; }
                handleCloudPayload(payload);
              }
            } catch (err) {}
          };
        } catch (err) {}

        // 3. Fallback 1-second short-poll (guarantees delivery if SSE/WS blocked by Wi-Fi or firewall)
        const pollTimer = setInterval(() => {
          fetch('https://ntfy.sh/elite_jonrad_hotel_304_dispatch/json?poll=1&since=12s')
            .then(r => r.text())
            .then(text => {
              text.trim().split('\n').forEach(line => {
                try {
                  const raw = JSON.parse(line);
                  if (raw.event === 'message' && raw.message) {
                    let payload = null;
                    try { payload = JSON.parse(raw.message); } catch (e) { payload = raw.message; }
                    handleCloudPayload(payload);
                  }
                } catch (e) {}
              });
            }).catch(() => {});
        }, 1000);

        return () => {
          window.removeEventListener('storage', handleStorage);
          if (bc) bc.close();
          if (eventSource) eventSource.close();
          if (ws) ws.close();
          clearInterval(pollTimer);
        };
      }, [startRinging, stopRinging, handleCloudPayload]);

      useEffect(() => {
        try {
          localStorage.setItem('elite_jonrad_requests', JSON.stringify(requests));
        } catch (e) {}
      }, [requests]);

      const incomingRequests = useMemo(() => requests.filter(r => r.status === 'pending'), [requests]);
      const dispatchedRequests = useMemo(() => requests.filter(r => r.status === 'dispatched'), [requests]);
      const completedRequests = useMemo(() => requests.filter(r => r.status === 'completed'), [requests]);

      const activeList = useMemo(() => {
        let list = [];
        if (activeTab === 'incoming') list = incomingRequests;
        else if (activeTab === 'dispatched') list = dispatchedRequests;
        else if (activeTab === 'completed') list = completedRequests;

        return list.filter(req => {
          if (selectedCategory !== 'All' && req.category !== selectedCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!req.room.toLowerCase().includes(q) &&
                !req.serviceItem.toLowerCase().includes(q) &&
                !req.guestName.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [activeTab, incomingRequests, dispatchedRequests, completedRequests, selectedCategory, searchQuery]);

      // Broadcast acceptance to cloud over all transports
      const sendAcceptBroadcast = (reqId) => {
        const payloadStr = JSON.stringify({ type: 'ACCEPT_REQUEST', id: reqId, assignedTo: 'Attendant Ana' });
        fetch('https://ntfy.sh/elite_jonrad_hotel_304_dispatch', { method: 'POST', body: payloadStr, keepalive: true }).catch(() => {});
        fetch('https://ntfy.sh/elite_jonrad_hotel_304_dispatch', { method: 'POST', mode: 'no-cors', body: payloadStr, keepalive: true }).catch(() => {});
        fetch('https://ntfy.sh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: 'elite_jonrad_hotel_304_dispatch', message: payloadStr, priority: 5 }),
          keepalive: true
        }).catch(() => {});
      };

      // Staff Accepts Request:
      // 1. Closes ringing immediately
      // 2. Removes from incoming side and moves to dispatched side
      const handleAccept = useCallback((reqId) => {
        stopRinging();
        setRequests(prev =>
          prev.map(r => r.id === reqId ? { ...r, status: 'dispatched', assignedTo: 'Attendant Ana' } : r)
        );
        setActiveTab('dispatched');
        sendAcceptBroadcast(reqId);

        setQuickNotice('✓ Request Accepted! Ringtone stopped. Moved to Dispatch Side.');
        setTimeout(() => setQuickNotice(null), 4000);
      }, [stopRinging]);

      // Fast Process: Accept All
      const handleAcceptAll = useCallback(() => {
        if (incomingRequests.length === 0) return;
        stopRinging();
        setRequests(prev =>
          prev.map(r => {
            if (r.status === 'pending') {
              sendAcceptBroadcast(r.id);
              return { ...r, status: 'dispatched', assignedTo: 'Attendant Ana' };
            }
            return r;
          })
        );
        setActiveTab('dispatched');
        setQuickNotice(`⚡ Fast-Processed ALL (${incomingRequests.length}) requests! Ringtone silenced.`);
        setTimeout(() => setQuickNotice(null), 4000);
      }, [incomingRequests, stopRinging]);

      // Fast Process: Accept + Send ETA
      const handleQuickAcceptAndEta = useCallback((reqId, mins = 3) => {
        stopRinging();
        setRequests(prev =>
          prev.map(r =>
            r.id === reqId
              ? {
                  ...r,
                  status: 'dispatched',
                  assignedTo: 'Attendant Ana',
                  notes: r.notes ? `${r.notes} | ETA: ${mins}m` : `Attendant en route • ETA: ${mins}m`
                }
              : r
          )
        );
        setActiveTab('dispatched');
        sendAcceptBroadcast(reqId);

        setQuickNotice(`⚡ Fast-Accepted with ${mins}m ETA! Moved to Dispatch Side.`);
        setTimeout(() => setQuickNotice(null), 4000);
      }, [stopRinging]);

      // Keyboard shortcuts: Space/Enter = Accept first incoming, A = Accept all
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          if ((e.code === 'Space' || e.key === 'Enter') && incomingRequests.length > 0) {
            e.preventDefault();
            const targetReq = incomingRequests[0];
            handleAccept(targetReq.id);
            setQuickNotice(`⚡ Fast-Accepted Room ${targetReq.room} [${e.code === 'Space' ? 'Space' : 'Enter'}]! Ringtone stopped.`);
          } else if ((e.key === 'a' || e.key === 'A') && incomingRequests.length > 0) {
            e.preventDefault();
            handleAcceptAll();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [incomingRequests, handleAccept, handleAcceptAll]);

      const handleComplete = (reqId) => {
        setRequests(prev =>
          prev.map(r => r.id === reqId ? { ...r, status: 'completed' } : r)
        );
        setQuickNotice('✓ Marked as completed.');
        setTimeout(() => setQuickNotice(null), 2500);
      };

      const handleNoteSubmit = (id) => {
        if (!noteText.trim()) return;
        setRequests(prev =>
          prev.map(r => r.id === id ? { ...r, notes: r.notes ? `${r.notes} | ${noteText.trim()}` : noteText.trim() } : r)
        );
        setNoteText('');
        setNoteInputId(null);
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-800 font-sans pb-12 selection:bg-blue-100">
          
          {/* Continuous Ringing Alarm Banner */}
          {isStaffRinging && (
            <div className="bg-gradient-to-r from-red-600 via-rose-600 to-red-700 text-white px-4 py-3 shadow-xl border-b-2 border-red-800 animate-pulse sticky top-0 z-50">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="text-3xl animate-bounce">🔔</span>
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="text-sm sm:text-base font-extrabold tracking-wide uppercase">
                        INCOMING GUEST CALL RINGING NOW!
                      </h2>
                      <span className="bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full border border-white/30">
                        Press [Space] to Fast-Accept
                      </span>
                    </div>
                    <p className="text-xs text-red-100">
                      Ringtone is actively ringing on staff side. Accept request to silence.
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  {incomingRequests.length > 0 && (
                    <>
                      <button
                        onClick={() => handleAccept(incomingRequests[0].id)}
                        className="px-4 py-2 rounded-lg bg-white text-red-700 hover:bg-red-50 text-xs font-black shadow-lg transition-transform active:scale-95 cursor-pointer flex items-center gap-1.5"
                        title="Shortcut: Press Space on keyboard"
                      >
                        <span>⚡ Fast Accept</span>
                        <kbd className="bg-red-100 text-red-800 text-[10px] px-1.5 py-0.5 rounded font-mono font-bold">Space</kbd>
                      </button>

                      <button
                        onClick={() => handleQuickAcceptAndEta(incomingRequests[0].id, 3)}
                        className="px-3 py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-900 text-xs font-bold shadow-md transition-transform active:scale-95 cursor-pointer flex items-center gap-1"
                        title="Accept and dispatch with 3 min ETA"
                      >
                        <span>⚡ Accept + 3m ETA</span>
                      </button>

                      {incomingRequests.length > 1 && (
                        <button
                          onClick={handleAcceptAll}
                          className="px-3 py-2 rounded-lg bg-red-950 hover:bg-black text-amber-300 text-xs font-bold shadow-md transition-transform active:scale-95 cursor-pointer flex items-center gap-1"
                          title="Shortcut: Press A on keyboard"
                        >
                          <span>⚡ Accept All ({incomingRequests.length})</span>
                        </button>
                      )}
                    </>
                  )}
                  <button
                    onClick={stopRinging}
                    className="px-3 py-2 rounded-lg bg-red-900/80 hover:bg-red-900 text-white/90 text-xs font-semibold cursor-pointer border border-red-500/30"
                  >
                    Mute Alarm
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Fast Processing Keyboard Helper Strip */}
          <div className="bg-[#0F2756] text-amber-200 text-xs py-1.5 px-4 border-b border-amber-300/20">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="font-bold tracking-wide">⚡ Fast Process Active:</span>
                <span className="text-white/90">
                  Press <kbd className="bg-white/20 text-white px-1.5 py-0.5 rounded font-mono text-[11px] font-bold">Space</kbd> or <kbd className="bg-white/20 text-white px-1.5 py-0.5 rounded font-mono text-[11px] font-bold">Enter</kbd> to instantly accept incoming ringing call.
                </span>
              </div>
              <div className="flex items-center gap-3 text-[11px] text-amber-300/80">
                <span>🔊 Audio: {soundEnabled ? 'Live & Armed' : 'Muted'}</span>
                <span>•</span>
                <span>⚡ Multi-Channel Cloud Sync: Online</span>
              </div>
            </div>
          </div>

          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-[#0F2756] text-amber-200 flex items-center justify-center font-serif text-sm font-semibold shadow-sm border border-amber-300/30">
                  EJ
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs uppercase tracking-widest font-bold text-slate-500">
                      ELITE JONRAD HOTEL
                    </span>
                    <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold border border-slate-200">
                      Floor 3 Terminal
                    </span>
                  </div>
                  <h1 className="text-sm sm:text-base font-bold text-[#0F2756] leading-none mt-0.5">
                    Staff Operations &amp; Guest Request Dispatch
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {/* Test Chime Button */}
                <button
                  onClick={() => {
                    ensureAudio();
                    playSingleBellChime();
                    setQuickNotice('🔔 Brass Bell Chime Tested!');
                    setTimeout(() => setQuickNotice(null), 2000);
                  }}
                  className="px-2.5 py-1.5 rounded-lg border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs font-semibold flex items-center gap-1.5 cursor-pointer transition-colors"
                  title="Test the hotel desk bell chime sound"
                >
                  <span>🔔 Test Chime</span>
                </button>

                {/* Audio Toggle */}
                <button
                  onClick={() => {
                    const next = !soundEnabled;
                    setSoundEnabled(next);
                    if (next) playSingleBellChime();
                  }}
                  className={`p-2 rounded-lg border text-xs font-medium flex items-center gap-1.5 transition-colors cursor-pointer ${
                    soundEnabled
                      ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
                      : 'bg-slate-100 border-slate-200 text-slate-400'
                  }`}
                  title="Toggle Staff Audio Ringtone"
                >
                  <span>{soundEnabled ? '🔊' : '🔇'}</span>
                  <span className="hidden md:inline">{soundEnabled ? 'Audio Armed' : 'Muted'}</span>
                </button>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-slate-500">Duty:</span>
                  <span className="font-semibold text-slate-800">Ana Morales (Captain)</span>
                </div>
              </div>
            </div>
          </header>

          {quickNotice && (
            <div className="fixed top-20 right-6 z-50 bg-[#0F2756] text-white px-4 py-2.5 rounded-xl shadow-lg border border-slate-700 text-xs font-medium flex items-center gap-2 animate-in fade-in">
              <span>{quickNotice}</span>
            </div>
          )}

          {/* Body */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            
            {/* Metric Cards */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6">
              <div
                onClick={() => setActiveTab('incoming')}
                className={`p-4 rounded-xl border shadow-xs flex items-center justify-between cursor-pointer transition-all ${
                  activeTab === 'incoming'
                    ? 'ring-2 ring-red-400 bg-red-50/20 border-red-300'
                    : 'bg-white border-slate-200 hover:border-slate-300'
                }`}
              >
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Incoming Calls (Unaccepted)
                  </p>
                  <h3 className="text-2xl font-bold text-red-600 mt-1 font-mono flex items-center gap-2">
                    {incomingRequests.length}
                    {isStaffRinging && (
                      <span className="inline-flex w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                    )}
                  </h3>
                  <p className="text-[11px] text-red-600 font-medium mt-0.5">
                    {isStaffRinging ? 'Ringing continuously!' : incomingRequests.length > 0 ? 'Needs acceptance' : 'Queue clear'}
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-lg border border-red-100">
                  🔔
                </div>
              </div>

              <div
                onClick={() => setActiveTab('dispatched')}
                className={`p-4 rounded-xl border shadow-xs flex items-center justify-between cursor-pointer transition-all ${
                  activeTab === 'dispatched'
                    ? 'ring-2 ring-blue-500 bg-blue-50/20 border-blue-300'
                    : 'bg-white border-slate-200 hover:border-slate-300'
                }`}
              >
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Dispatched Side (In Action)
                  </p>
                  <h3 className="text-2xl font-bold text-blue-600 mt-1 font-mono">
                    {dispatchedRequests.length}
                  </h3>
                  <p className="text-[11px] text-blue-500 font-medium mt-0.5">
                    Accepted &amp; in-flight
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg border border-blue-100">
                  🚀
                </div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Floor SLA Speed
                  </p>
                  <h3 className="text-2xl font-bold text-slate-900 mt-1 font-mono">
                    3.4m
                  </h3>
                  <p className="text-[11px] text-slate-500 font-medium mt-0.5">
                    Target: &lt; 6 mins
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg border border-amber-100">
                  ⚡
                </div>
              </div>

              <div
                onClick={() => setActiveTab('completed')}
                className={`p-4 rounded-xl border shadow-xs flex items-center justify-between cursor-pointer transition-all ${
                  activeTab === 'completed'
                    ? 'ring-2 ring-emerald-500 bg-emerald-50/20 border-emerald-300'
                    : 'bg-white border-slate-200 hover:border-slate-300'
                }`}
              >
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Completed Side
                  </p>
                  <h3 className="text-2xl font-bold text-emerald-600 mt-1 font-mono">
                    {completedRequests.length}
                  </h3>
                  <p className="text-[11px] text-emerald-700 font-medium mt-0.5">
                    Delivered &amp; resolved
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg border border-emerald-100">
                  ✓
                </div>
              </div>
            </div>

            {/* Controls */}
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs mb-6 space-y-4">
              <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                <div className="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                  <button
                    onClick={() => setActiveTab('incoming')}
                    className={`px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${
                      activeTab === 'incoming'
                        ? 'bg-red-600 text-white shadow-sm'
                        : 'text-slate-700 hover:text-slate-900'
                    }`}
                  >
                    <span>🚨 Incoming Requests</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                      activeTab === 'incoming' ? 'bg-white text-red-700' : 'bg-red-100 text-red-700'
                    }`}>
                      {incomingRequests.length}
                    </span>
                    {isStaffRinging && (
                      <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>
                    )}
                  </button>

                  <button
                    onClick={() => setActiveTab('dispatched')}
                    className={`px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${
                      activeTab === 'dispatched'
                        ? 'bg-[#0F2756] text-white shadow-sm'
                        : 'text-slate-700 hover:text-slate-900'
                    }`}
                  >
                    <span>🚀 Dispatched Side</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                      activeTab === 'dispatched' ? 'bg-blue-400 text-slate-900' : 'bg-blue-100 text-blue-800'
                    }`}>
                      {dispatchedRequests.length}
                    </span>
                  </button>

                  <button
                    onClick={() => setActiveTab('completed')}
                    className={`px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all cursor-pointer ${
                      activeTab === 'completed'
                        ? 'bg-emerald-600 text-white shadow-sm font-semibold'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>✓ Completed</span>
                    <span className={`px-1.5 py-0.5 rounded-full text-[10px] ${
                      activeTab === 'completed' ? 'bg-white text-emerald-800' : 'bg-slate-200 text-slate-700'
                    }`}>
                      {completedRequests.length}
                    </span>
                  </button>
                </div>

                <div className="relative flex-1 max-w-xs sm:max-w-sm">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
                    🔍
                  </span>
                  <input
                    type="text"
                    placeholder="Search Room, Item, or Guest..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0F2756]/20 focus:border-[#0F2756]"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 text-xs"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider shrink-0 mr-1">
                  Department:
                </span>
                {['All', 'Housekeeping', 'Room Service', 'Maintenance', 'Front Desk'].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3 py-1 rounded-full text-xs font-medium transition-colors shrink-0 cursor-pointer ${
                      selectedCategory === cat
                        ? 'bg-[#0F2756] text-white'
                        : 'bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200/80'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            {/* List */}
            <div className="space-y-3">
              <div className="flex items-center justify-between px-1">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500">
                  {activeTab === 'incoming' && '🚨 Incoming Queue (Unaccepted Calls — Ringing)'}
                  {activeTab === 'dispatched' && '🚀 Dispatched Side (Only Accepted Requests)'}
                  {activeTab === 'completed' && '✓ Completed History'}
                </h2>
                <span className="text-xs text-slate-400">
                  Showing {activeList.length} items
                </span>
              </div>

              {activeList.length === 0 ? (
                <div className="bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center">
                  <span className="text-4xl">
                    {activeTab === 'incoming' ? '🎉' : activeTab === 'dispatched' ? '📦' : '📜'}
                  </span>
                  <h4 className="text-sm font-bold text-slate-700 mt-2">
                    {activeTab === 'incoming' && 'No Incoming Requests'}
                    {activeTab === 'dispatched' && 'No Dispatched Requests Yet'}
                    {activeTab === 'completed' && 'No Completed Requests'}
                  </h4>
                  <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
                    {activeTab === 'incoming' && 'All guest requests have been accepted and moved to the Dispatched side! Ringtone is silent.'}
                    {activeTab === 'dispatched' && 'When you accept an incoming request, it will appear strictly here on the Dispatched side.'}
                    {activeTab === 'completed' && 'Resolved requests will be archived here.'}
                  </p>
                </div>
              ) : (
                activeList.map(req => {
                  const isPending = req.status === 'pending';
                  const isDispatched = req.status === 'dispatched';
                  const isCompleted = req.status === 'completed';

                  return (
                    <div
                      key={req.id}
                      className={`bg-white rounded-xl border p-4 sm:p-5 transition-all shadow-xs ${
                        isPending
                          ? 'border-red-400 bg-red-50/15 ring-2 ring-red-200'
                          : isDispatched
                          ? 'border-blue-300 bg-blue-50/10'
                          : 'border-slate-200'
                      }`}
                    >
                      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        
                        <div className="flex items-start gap-3.5">
                          <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center font-bold font-mono shrink-0 border ${
                            isPending
                              ? 'bg-red-100 text-red-900 border-red-300 animate-pulse'
                              : req.room === '304'
                              ? 'bg-blue-50 text-blue-900 border-blue-200'
                              : 'bg-slate-100 text-slate-800 border-slate-200'
                          }`}>
                            <span className="text-base leading-none">{req.room}</span>
                            <span className="text-[9px] font-normal text-slate-500 mt-0.5">Floor 3</span>
                          </div>

                          <div>
                            <div className="flex flex-wrap items-center gap-2">
                              <span className="text-base">{req.icon}</span>
                              <h3 className="text-sm sm:text-base font-bold text-slate-900">
                                {req.serviceItem}
                              </h3>

                              {isPending && (
                                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-600 text-white flex items-center gap-1 animate-pulse">
                                  <span>🔔 Ringing Now</span>
                                </span>
                              )}

                              {isDispatched && (
                                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-100 text-blue-800 border border-blue-200">
                                  🚀 Dispatched &amp; En Route
                                </span>
                              )}

                              {isCompleted && (
                                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">
                                  ✓ Completed
                                </span>
                              )}
                            </div>

                            <div className="flex flex-wrap items-center gap-x-2 text-xs text-slate-500 mt-1">
                              <span className="font-semibold text-slate-700">{req.guestName}</span>
                              <span>•</span>
                              <span>{req.roomType}</span>
                              <span>•</span>
                              <span className="bg-slate-100 px-2 py-0.5 rounded text-[10px] text-slate-600 font-medium">
                                {req.department}
                              </span>
                            </div>

                            {req.notes && (
                              <p className="text-xs text-slate-600 mt-2 bg-slate-50/80 p-2 rounded-lg border border-slate-100">
                                <strong className="text-slate-700">Dispatch Note:</strong> {req.notes}
                              </p>
                            )}
                          </div>
                        </div>

                        <div className="flex flex-wrap sm:flex-col items-end gap-2 shrink-0 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                          <div className="text-[11px] text-slate-500 flex items-center gap-1 mb-1">
                            <span>Assigned:</span>
                            <span className="font-semibold text-slate-800">{req.assignedTo}</span>
                          </div>

                          <div className="flex items-center gap-2">
                            {/* FAST ACCEPT (Incoming only): Closes ringing & moves to dispatched side */}
                            {isPending && (
                              <div className="flex flex-wrap items-center gap-1.5">
                                <button
                                  onClick={() => handleAccept(req.id)}
                                  className="px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-black shadow-md transition-all flex items-center gap-1.5 cursor-pointer active:scale-95"
                                  title="Shortcut: Space"
                                >
                                  <span>⚡ Instant Accept</span>
                                  <kbd className="bg-red-800 text-white text-[10px] px-1 py-0.2 rounded font-mono">Space</kbd>
                                </button>
                                <button
                                  onClick={() => handleQuickAcceptAndEta(req.id, 3)}
                                  className="px-2.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-xs transition-colors cursor-pointer flex items-center gap-1"
                                  title="Accept and dispatch with 3m ETA"
                                >
                                  <span>⚡ +3m ETA</span>
                                </button>
                                <button
                                  onClick={() => handleQuickAcceptAndEta(req.id, 5)}
                                  className="px-2 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-semibold cursor-pointer"
                                  title="Accept and dispatch with 5m ETA"
                                >
                                  +5m
                                </button>
                              </div>
                            )}

                            {isDispatched && (
                              <button
                                onClick={() => handleComplete(req.id)}
                                className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-xs transition-colors cursor-pointer"
                              >
                                ✓ Mark Completed
                              </button>
                            )}

                            {isCompleted && (
                              <button
                                onClick={() => {
                                  setRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: 'dispatched' } : r));
                                  setActiveTab('dispatched');
                                }}
                                className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium cursor-pointer"
                              >
                                Re-dispatch
                              </button>
                            )}

                            <button
                              onClick={() => setNoteInputId(noteInputId === req.id ? null : req.id)}
                              className="px-2 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 text-xs hover:bg-slate-100 cursor-pointer"
                              title="Add note"
                            >
                              💬
                            </button>
                          </div>
                        </div>
                      </div>

                      {noteInputId === req.id && (
                        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2">
                          <input
                            type="text"
                            placeholder="Add attendant note..."
                            value={noteText}
                            onChange={e => setNoteText(e.target.value)}
                            className="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#0F2756]"
                            onKeyDown={e => {
                              if (e.key === 'Enter') handleNoteSubmit(req.id);
                            }}
                          />
                          <button
                            onClick={() => handleNoteSubmit(req.id)}
                            className="px-3 py-1.5 bg-[#0F2756] text-white text-xs font-semibold rounded-lg hover:bg-[#1E3A8A] cursor-pointer"
                          >
                            Save
                          </button>
                          <button
                            onClick={() => setNoteInputId(null)}
                            className="px-2 py-1.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer"
                          >
                            Cancel
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StaffApp />);
  </script>
</body>
</html>
