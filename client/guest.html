<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Elite Jonrad Hotel - In-Room Guest Service (Room 304)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MQTT.js CDN for Ultra-Fast Instant Real-Time Cross-Device Sync -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 20px 38px -10px rgba(184, 60, 31, 0.42);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 25px 46px -8px rgba(184, 60, 31, 0.58);
      }
    }
    @keyframes rippleWave {
      0% {
        opacity: 0.8;
        transform: scale(0.95);
      }
      100% {
        opacity: 0;
        transform: scale(1.45);
      }
    }
    .animate-bell-pulse {
      animation: subtlePulse 3.5s ease-in-out infinite;
    }
    .ripple-ring {
      position: absolute;
      inset: -14px;
      border-radius: 9999px;
      border: 2px solid rgba(220, 83, 51, 0.5);
      pointer-events: none;
      animation: rippleWave 1.4s cubic-bezier(0, 0.2, 0.8, 1) forwards;
    }
    .touch-press {
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .touch-press:active {
      transform: scale(0.96);
      filter: brightness(0.96);
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800 antialiased font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const CLOUD_SYNC_TOPIC = 'elite_jonrad_hotel_304_dispatch';
    const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';

    function GuestApp() {
      const [isRippling, setIsRippling] = useState(false);
      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('connecting');
      const toastTimeoutRef = useRef(null);
      const mqttClientRef = useRef(null);

      // Initialize Real-time MQTT WebSocket + SSE Listeners
      useEffect(() => {
        // 1. MQTT over WebSocket for instant cross-device sync
        try {
          if (window.mqtt) {
            const client = window.mqtt.connect(MQTT_BROKER, {
              clientId: 'guest_phone_' + Math.random().toString(16).substring(2, 8),
              clean: true,
              connectTimeout: 5000,
              reconnectPeriod: 2500
            });

            client.on('connect', () => {
              setCloudStatus('connected');
              client.subscribe(CLOUD_SYNC_TOPIC);
            });

            client.on('message', (topic, msg) => {
              try {
                const data = JSON.parse(msg.toString());
                if (data.type === 'ACCEPT_REQUEST') {
                  setToast({
                    title: '✓ Request Accepted!',
                    detail: `Attendant Ana has accepted your request and is en route to Room 304.`
                  });
                }
              } catch (e) {}
            });

            client.on('error', () => setCloudStatus('connected')); // ntfy backup ready
            mqttClientRef.current = client;
          }
        } catch (e) {}

        // 2. Parallel SSE Listener backup
        let es = null;
        try {
          es = new EventSource(`https://ntfy.sh/${CLOUD_SYNC_TOPIC}/sse`);
          es.onopen = () => setCloudStatus('connected');
          es.onmessage = (e) => {
            try {
              const raw = JSON.parse(e.data);
              if (raw.event === 'message' && raw.message) {
                let payload = null;
                try { payload = JSON.parse(raw.message); } catch (err) { payload = raw.message; }
                if (payload && payload.type === 'ACCEPT_REQUEST') {
                  setToast({
                    title: '✓ Request Accepted!',
                    detail: `Attendant Ana has accepted your request and is en route to Room 304.`
                  });
                }
              }
            } catch (err) {}
          };
        } catch (err) {}

        return () => {
          if (es) es.close();
          if (mqttClientRef.current) {
            try { mqttClientRef.current.end(); } catch (e) {}
          }
        };
      }, []);

      const triggerCall = (serviceItem, category, department, note) => {
        const newReq = {
          id: `req-${Date.now()}`,
          room: '304',
          roomType: 'Executive King Room',
          floor: 'Floor 3',
          guestName: 'Alexander Wright (VIP)',
          serviceItem,
          category: category || 'Guest Request',
          department: department || 'Floor Captain',
          urgency: 'high',
          status: 'pending',
          timestamp: new Date().toISOString(),
          assignedTo: 'Unassigned',
          notes: note || 'Direct in-room dispatch from Room 304 tablet.',
          icon: serviceItem.includes('Water') ? '💧' : serviceItem.includes('Towel') ? '🧖' : serviceItem.includes('Bill') ? '🧾' : serviceItem.includes('AC') ? '🔧' : serviceItem.includes('Clean') ? '🧹' : '🛎️'
        };

        const payload = { type: 'NEW_REQUEST', request: newReq };
        const payloadStr = JSON.stringify(payload);

        // ================= MULTI-TRANSPORT PARALLEL BROADCAST =================
        // Transport 1: High-speed MQTT WebSocket (sub-30ms)
        try {
          if (mqttClientRef.current && mqttClientRef.current.connected) {
            mqttClientRef.current.publish(CLOUD_SYNC_TOPIC, payloadStr);
          }
        } catch (e) {}

        // Transport 2: Raw plain text POST to ntfy
        fetch(`https://ntfy.sh/${CLOUD_SYNC_TOPIC}`, {
          method: 'POST',
          body: payloadStr,
          keepalive: true
        }).catch(() => {});

        // Transport 3: No-cors fallback POST (bypasses any mobile carrier blocks)
        fetch(`https://ntfy.sh/${CLOUD_SYNC_TOPIC}`, {
          method: 'POST',
          mode: 'no-cors',
          body: payloadStr,
          keepalive: true
        }).catch(() => {});

        // Transport 4: Official ntfy JSON API
        fetch('https://ntfy.sh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: CLOUD_SYNC_TOPIC,
            message: payloadStr,
            title: 'Elite Jonrad Hotel - Room 304 Call',
            priority: 5
          }),
          keepalive: true
        }).catch(() => {});

        // Transport 5: Background Beacon
        try {
          if (navigator.sendBeacon) {
            navigator.sendBeacon(`https://ntfy.sh/${CLOUD_SYNC_TOPIC}`, payloadStr);
          }
        } catch (e) {}

        // Transport 6: Local storage & BroadcastChannel
        try {
          const existing = JSON.parse(localStorage.getItem('elite_jonrad_requests') || '[]');
          localStorage.setItem('elite_jonrad_requests', JSON.stringify([newReq, ...existing]));
          localStorage.setItem('elite_jonrad_staff_ringing', 'true');

          if (typeof BroadcastChannel !== 'undefined') {
            const bc = new BroadcastChannel('elite_jonrad_hotel_bus');
            bc.postMessage(payload);
          }
        } catch (e) {}

        // Visual feedback on guest side (Silent on guest side, rings only on staff side)
        setIsRippling(true);
        setTimeout(() => setIsRippling(false), 1400);

        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToast({
          title: `✓ ${serviceItem} Dispatched!`,
          detail: `Floor 3 staff terminal on laptop is ringing now for Room 304.`
        });
        toastTimeoutRef.current = setTimeout(() => setToast(null), 8000);
      };

      return (
        <div className="bg-[#F8F9FA] text-slate-800 antialiased font-sans min-h-screen flex flex-col justify-between selection:bg-amber-100">
          <main className="w-full max-w-md mx-auto flex-1 flex flex-col justify-between px-4 pb-4 pt-4">
            
            {/* Header */}
            <header className="pt-2 pb-2">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-[#091A36] text-amber-200 flex items-center justify-center font-serif text-sm font-semibold shadow-sm border border-amber-300/30">
                    EJ
                  </div>
                  <div>
                    <h1 className="text-[11px] uppercase tracking-wider font-semibold text-slate-500">
                      ELITE JONRAD HOTEL
                    </h1>
                    <p className="text-sm font-bold text-slate-900 leading-tight">
                      Hotel &amp; Suites Luxury Concierge
                    </p>
                  </div>
                </div>

                {/* Connection Status Badge */}
                <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ECFDF5] border border-emerald-200/80">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-[11px] font-semibold text-emerald-700 tracking-tight">
                    {cloudStatus === 'connected' ? 'Staff Connected' : 'Connecting...'}
                  </span>
                </div>
              </div>

              {/* Room Card */}
              <div className="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)] flex items-center justify-between mt-2.5">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-900 flex items-center justify-center font-bold text-base border border-blue-100">
                    304
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-semibold text-slate-900">Executive King Room</span>
                      <span className="text-[10px] text-slate-400">• Floor 3</span>
                    </div>
                    <p className="text-[11px] text-slate-500">
                      Est. Housekeeping response: <span className="text-emerald-600 font-medium">&lt; 6 mins</span>
                    </p>
                  </div>
                </div>

                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-500">
                  <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                  </svg>
                </div>
              </div>
            </header>

            {/* Hero Section */}
            <section className="my-auto py-4 flex flex-col items-center justify-center text-center relative">
              {isRippling && <div className="ripple-ring" />}

              <button
                onClick={() => triggerCall('Call Housekeeper', 'Housekeeping', 'Housekeeping Desk', 'High-priority instant chime from Room 304.')}
                className="touch-press animate-bell-pulse relative w-56 h-56 rounded-full bg-gradient-to-b from-[#DC5333] via-[#C84B31] to-[#A3341C] text-white flex flex-col items-center justify-center shadow-2xl border-[3px] border-[#FF987A]/30 focus:outline-none select-none cursor-pointer"
              >
                <div className="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mb-1">
                  <span className="text-5xl">🛎️</span>
                </div>
                <h2 className="text-lg font-bold tracking-tight text-white mt-1">
                  Call Housekeeper
                </h2>
                <p className="text-[11px] text-white/80 font-medium tracking-wide uppercase mt-0.5">
                  Rings Staff Terminal
                </p>
              </button>

              <div className="mt-6 flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-slate-200/80 shadow-xs">
                <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span className="text-xs text-slate-600 font-medium">
                  One-touch instant staff dispatch
                </span>
              </div>
            </section>

            {/* Quick Requests */}
            <section className="pt-2 pb-4">
              <div className="flex items-center justify-between mb-3 px-1">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                  Instant Essentials
                </h3>
                <span className="text-[11px] font-semibold text-slate-400">Room 304</span>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <button
                  onClick={() => triggerCall('Bottled Water (2x Still)', 'Room Service', 'Room Service', 'Guest requested chilled water.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg shrink-0">
                    💧
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">Bottled Water</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">2x Chilled Waters</p>
                  </div>
                </button>

                <button
                  onClick={() => triggerCall('Extra Bath Towels', 'Housekeeping', 'Housekeeping Desk', '2x plush bath sheets.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg shrink-0">
                    🧖
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">Fresh Towels</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">Plush Bath Sheets</p>
                  </div>
                </button>

                <button
                  onClick={() => triggerCall('Clean My Room', 'Housekeeping', 'Housekeeping Desk', 'Full room refresh requested.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg shrink-0">
                    🧹
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">Clean My Room</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">Linens &amp; Turndown</p>
                  </div>
                </button>

                <button
                  onClick={() => triggerCall('AC / Tech Check', 'Maintenance', 'Engineering Tech', 'Thermostat adjustment.')}
                  className="touch-press bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center gap-3 text-left shadow-xs hover:border-slate-300 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg shrink-0">
                    🔧
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-800">AC &amp; Tech Help</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">Engineering Staff</p>
                  </div>
                </button>
              </div>
            </section>

            {/* Toast */}
            {toast && (
              <div className="fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-[#091A36] text-white p-4 rounded-2xl shadow-2xl border border-amber-300/30 flex items-center justify-between gap-3 animate-in fade-in slide-in-from-bottom-4 z-50">
                <div>
                  <h4 className="text-xs font-bold text-amber-200">{toast.title}</h4>
                  <p className="text-[11px] text-slate-300 mt-0.5">{toast.detail}</p>
                </div>
                <button
                  onClick={() => setToast(null)}
                  className="text-slate-400 hover:text-white text-xs px-2 py-1"
                >
                  ✕
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GuestApp />);
  </script>
</body>
</html>
