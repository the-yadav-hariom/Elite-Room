<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>The Grand Azure - In-Room Guest Service & Staff Terminal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel Standalone for Instant Local Preview -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 20px 38px -10px rgba(184, 60, 31, 0.42);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 25px 46px -8px rgba(184, 60, 31, 0.58);
      }
    }
    @keyframes rippleWave {
      0% {
        opacity: 0.8;
        transform: scale(0.95);
      }
      100% {
        opacity: 0;
        transform: scale(1.45);
      }
    }
    .animate-bell-pulse {
      animation: subtlePulse 3.5s ease-in-out infinite;
    }
    .ripple-ring {
      position: absolute;
      inset: -14px;
      border-radius: 9999px;
      border: 2px solid rgba(220, 83, 51, 0.5);
      pointer-events: none;
      animation: rippleWave 1.4s cubic-bezier(0, 0.2, 0.8, 1) forwards;
    }
    .touch-press {
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .touch-press:active {
      transform: scale(0.96);
      filter: brightness(0.96);
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo, useCallback } = React;

    const INITIAL_REQUESTS = [
      {
        id: 'req-304-bell',
        room: '304',
        roomType: 'Executive King Room',
        floor: 'Floor 3',
        guestName: 'Alexander Wright (VIP)',
        serviceItem: 'Call Housekeeper',
        category: 'Housekeeping',
        department: 'Housekeeping Desk',
        urgency: 'high',
        status: 'pending', // 'pending' | 'dispatched' | 'completed'
        timestamp: new Date(Date.now() - 1000 * 60 * 2).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'In-room chime rung via luxury concierge tablet.',
        icon: '🛎️'
      },
      {
        id: 'req-304-water',
        room: '304',
        roomType: 'Executive King Room',
        floor: 'Floor 3',
        guestName: 'Alexander Wright (VIP)',
        serviceItem: 'Bottled Water (2x Still)',
        category: 'Room Service',
        department: 'Room Service',
        urgency: 'medium',
        status: 'dispatched',
        timestamp: new Date(Date.now() - 1000 * 60 * 8).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'Chilled waters requested.',
        icon: '💧'
      },
      {
        id: 'req-312-clean',
        room: '312',
        roomType: 'Deluxe Sea View Suite',
        floor: 'Floor 3',
        guestName: 'Elena Rostova',
        serviceItem: 'Clean My Room',
        category: 'Housekeeping',
        department: 'Housekeeping Desk',
        urgency: 'low',
        status: 'dispatched',
        timestamp: new Date(Date.now() - 1000 * 60 * 18).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'Fresh linens requested.',
        icon: '🧹'
      },
      {
        id: 'req-308-ac',
        room: '308',
        roomType: 'Terrace Junior Suite',
        floor: 'Floor 3',
        guestName: 'Marcus Vance',
        serviceItem: 'AC / Tech Check',
        category: 'Maintenance',
        department: 'Engineering Tech',
        urgency: 'medium',
        status: 'dispatched',
        timestamp: new Date(Date.now() - 1000 * 60 * 24).toISOString(),
        assignedTo: 'Tech Mike',
        notes: 'Thermostat reading 24C, requested adjustment to 20C.',
        icon: '🔧'
      },
      {
        id: 'req-301-towels',
        room: '301',
        roomType: 'Superior Queen',
        floor: 'Floor 3',
        guestName: 'Sophia Lin',
        serviceItem: 'Extra Bath Towels',
        category: 'Housekeeping',
        department: 'Housekeeping Desk',
        urgency: 'low',
        status: 'completed',
        timestamp: new Date(Date.now() - 1000 * 60 * 45).toISOString(),
        assignedTo: 'Attendant Ana',
        notes: 'Delivered 2x plush bath sheets.',
        icon: '🧖'
      }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('split'); // 'guest' | 'staff' | 'split'
      const [requests, setRequests] = useState(INITIAL_REQUESTS);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [isStaffRinging, setIsStaffRinging] = useState(false);
      const [latestRingingRequest, setLatestRingingRequest] = useState(null);
      const [quickNotice, setQuickNotice] = useState(null);

      const audioContextRef = useRef(null);
      const ringIntervalRef = useRef(null);

      // Play double brass desk chime
      const playSingleBellChime = useCallback(() => {
        if (!soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!audioContextRef.current) {
            audioContextRef.current = new AudioCtx();
          }
          const ctx = audioContextRef.current;
          if (ctx.state === 'suspended') ctx.resume();

          const now = ctx.currentTime;
          // Tone 1
          [2093, 2637, 3135].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.24 / (idx + 1), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.95);
          });

          // Tone 2 (double ding)
          [1760, 2093, 2793].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now + 0.22);
            gain.gain.setValueAtTime(0.28 / (idx + 1), now + 0.22);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + 0.22);
            osc.stop(now + 1.45);
          });
        } catch (err) {
          console.warn('Audio notice:', err);
        }
      }, [soundEnabled]);

      // Start continuous ringing (Staff Side Only)
      const startStaffRinging = useCallback((reqDetails) => {
        setIsStaffRinging(true);
        if (reqDetails) setLatestRingingRequest(reqDetails);

        playSingleBellChime();

        if (ringIntervalRef.current) clearInterval(ringIntervalRef.current);
        ringIntervalRef.current = setInterval(() => {
          playSingleBellChime();
        }, 1800);
      }, [playSingleBellChime]);

      // Stop continuous ringing
      const stopStaffRinging = useCallback(() => {
        setIsStaffRinging(false);
        setLatestRingingRequest(null);
        if (ringIntervalRef.current) {
          clearInterval(ringIntervalRef.current);
          ringIntervalRef.current = null;
        }
      }, []);

      useEffect(() => {
        return () => {
          if (ringIntervalRef.current) clearInterval(ringIntervalRef.current);
        };
      }, []);

      // Dispatch from guest side:
      // Ringtone ONLY rings continuously on the STAFF side!
      const addGuestRequest = (serviceItem, category, department, room = '304', customNote = '') => {
        const newReq = {
          id: `req-${Date.now()}`,
          room,
          roomType: room === '304' ? 'Executive King Room' : `Room ${room}`,
          floor: `Floor ${room.charAt(0)}`,
          guestName: room === '304' ? 'Alexander Wright (VIP)' : 'In-House Guest',
          serviceItem,
          category: category || 'Guest Request',
          department: department || 'Floor Captain',
          urgency: 'high',
          status: 'pending',
          timestamp: new Date().toISOString(),
          assignedTo: 'Unassigned',
          notes: customNote || `Dispatched from Room ${room} in-room tablet.`,
          icon: serviceItem.includes('Water') ? '💧' : serviceItem.includes('Towel') ? '🧖' : serviceItem.includes('Bill') ? '🧾' : serviceItem.includes('AC') ? '🔧' : serviceItem.includes('Clean') ? '🧹' : '🛎️'
        };

        setRequests(prev => [newReq, ...prev]);

        // START CONTINUOUS RINGING ON STAFF SIDE ONLY!
        startStaffRinging(newReq);
      };

      // When staff accepts request:
      // 1. Ringing stops immediately!
      // 2. Request status moves to 'dispatched' (only shows on dispatch side!)
      const acceptRequest = (id, attendantName = 'Attendant Ana') => {
        stopStaffRinging();
        setRequests(prev =>
          prev.map(r => r.id === id ? { ...r, status: 'dispatched', assignedTo: attendantName } : r)
        );
        setQuickNotice('✓ Request Accepted! Ringtone stopped. Moved to Dispatch Side.');
        setTimeout(() => setQuickNotice(null), 4000);
      };

      const updateRequestStatus = (id, newStatus, assignedTo) => {
        if (newStatus === 'dispatched' || newStatus === 'completed') {
          stopStaffRinging();
        }
        setRequests(prev =>
          prev.map(r => r.id === id ? { ...r, status: newStatus, assignedTo: assignedTo !== undefined ? assignedTo : r.assignedTo } : r)
        );
      };

      const addRequestNote = (id, noteText) => {
        setRequests(prev =>
          prev.map(r => r.id === id ? { ...r, notes: r.notes ? `${r.notes} | ${noteText}` : noteText } : r)
        );
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col font-sans">
          
          {/* Universal Header Switcher */}
          <div className="bg-[#091A36] border-b border-slate-700/80 px-4 py-2 flex flex-wrap items-center justify-between text-xs text-slate-300 gap-2 shrink-0">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="font-bold text-white tracking-wide">THE GRAND AZURE</span>
              <span className="text-slate-500">|</span>
              <span className="text-amber-200/90 font-medium">In-Room Request &amp; Staff Dispatch System</span>
            </div>

            <div className="flex items-center gap-1 bg-slate-800/90 p-1 rounded-lg border border-slate-700">
              <button
                onClick={() => setViewMode('guest')}
                className={`px-3 py-1 rounded-md font-semibold flex items-center gap-1.5 transition-all cursor-pointer ${
                  viewMode === 'guest'
                    ? 'bg-amber-400 text-slate-900 shadow-xs'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                <span>🛎️</span>
                <span>Guest Room (304)</span>
              </button>

              <button
                onClick={() => setViewMode('staff')}
                className={`px-3 py-1 rounded-md font-semibold flex items-center gap-1.5 transition-all cursor-pointer ${
                  viewMode === 'staff'
                    ? 'bg-blue-500 text-white shadow-xs'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                <span>📋</span>
                <span>Staff Terminal</span>
              </button>

              <button
                onClick={() => setViewMode('split')}
                className={`px-3 py-1 rounded-md font-semibold flex items-center gap-1.5 transition-all cursor-pointer ${
                  viewMode === 'split'
                    ? 'bg-emerald-500 text-white shadow-xs'
                    : 'text-slate-300 hover:text-white'
                }`}
              >
                <span>⚡</span>
                <span>Live Dual View</span>
              </button>
            </div>
          </div>

          {/* Quick Notice */}
          {quickNotice && (
            <div className="bg-emerald-500 text-white px-4 py-1.5 text-xs font-bold text-center tracking-wide animate-pulse">
              {quickNotice}
            </div>
          )}

          {/* Views */}
          <div className="flex-1 bg-[#F8FAFC]">
            {viewMode === 'guest' && (
              <div className="py-6 flex justify-center bg-slate-100 min-h-[calc(100vh-45px)]">
                <div className="w-full max-w-md bg-[#F8F9FA] rounded-3xl shadow-xl overflow-hidden border border-slate-200/80">
                  <GuestView
                    onSendRequest={addGuestRequest}
                    onSwitchToStaff={() => setViewMode('staff')}
                  />
                </div>
              </div>
            )}

            {viewMode === 'staff' && (
              <StaffView
                requests={requests}
                isStaffRinging={isStaffRinging}
                latestRingingRequest={latestRingingRequest}
                onAcceptRequest={acceptRequest}
                onStopRinging={stopStaffRinging}
                onUpdateStatus={updateRequestStatus}
                onAddNote={addRequestNote}
                soundEnabled={soundEnabled}
                setSoundEnabled={setSoundEnabled}
                playChime={playSingleBellChime}
                onSwitchToGuest={() => setViewMode('guest')}
              />
            )}

            {viewMode === 'split' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 min-h-[calc(100vh-45px)] divide-y lg:divide-y-0 lg:divide-x divide-slate-300">
                <div className="lg:col-span-4 bg-slate-100 p-4 sm:p-6 flex flex-col items-center justify-start overflow-y-auto">
                  <div className="text-center mb-3">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 bg-white px-3 py-1 rounded-full border border-slate-200 shadow-xs">
                      Guest View (Room 304 Tablet)
                    </span>
                    <p className="text-[10px] text-slate-400 mt-1">
                      Tap any request or bell below to ring the staff terminal continuously!
                    </p>
                  </div>
                  <div className="w-full max-w-sm bg-[#F8F9FA] rounded-3xl shadow-2xl overflow-hidden border border-slate-300/80 ring-8 ring-slate-800">
                    <GuestView
                      onSendRequest={addGuestRequest}
                    />
                  </div>
                </div>

                <div className="lg:col-span-8 bg-[#F8FAFC] overflow-y-auto">
                  <StaffView
                    requests={requests}
                    isStaffRinging={isStaffRinging}
                    latestRingingRequest={latestRingingRequest}
                    onAcceptRequest={acceptRequest}
                    onStopRinging={stopStaffRinging}
                    onUpdateStatus={updateRequestStatus}
                    onAddNote={addRequestNote}
                    soundEnabled={soundEnabled}
                    setSoundEnabled={setSoundEnabled}
                    playChime={playSingleBellChime}
                  />
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // GUEST ROOM COMPONENT (Matches screen.png)
    // -------------------------------------------------------------
    function GuestView({ onSendRequest, onSwitchToStaff }) {
      const [isRippling, setIsRippling] = useState(false);
      const [toast, setToast] = useState(null);
      const toastTimeoutRef = useRef(null);

      const triggerCall = (serviceItem, category, department, note) => {
        // Dispatches to staff terminal (Ringtone only rings on staff side!)
        onSendRequest(serviceItem, category, department, '304', note);
        setIsRippling(true);
        setTimeout(() => setIsRippling(false), 1400);

        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToast({
          title: `${serviceItem} Requested!`,
          detail: `Dispatched to ${department}. Floor 3 staff terminal is ringing continuously for Room 304.`
        });
        toastTimeoutRef.current = setTimeout(() => setToast(null), 7000);
      };

      return (
        <div className="bg-[#F8F9FA] text-slate-800 antialiased font-sans min-h-screen flex flex-col justify-between selection:bg-amber-100">
          <main className="w-full max-w-md mx-auto flex-1 flex flex-col justify-between px-4 pb-4 pt-4">
            
            {/* Header */}
            <header className="pt-2 pb-2">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-[#091A36] text-amber-200 flex items-center justify-center font-serif text-sm font-semibold shadow-sm border border-amber-300/30">
                    GA
                  </div>
                  <div>
                    <h1 className="text-[11px] uppercase tracking-wider font-semibold text-slate-500">
                      THE GRAND AZURE
                    </h1>
                    <p className="text-sm font-bold text-slate-900 leading-tight">
                      Hotel &amp; Suites Luxury Concierge
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ECFDF5] border border-emerald-200/80">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-[11px] font-semibold text-emerald-700 tracking-tight">
                    Live Concierge
                  </span>
                </div>
              </div>

              {/* Room 304 Card */}
              <div className="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)] flex items-center justify-between mt-2.5">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-900 flex items-center justify-center font-bold text-base border border-blue-100">
                    304
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-semibold text-slate-900">Executive King Room</span>
                      <span className="text-[10px] text-slate-400">• Floor 3</span>
                    </div>
                    <p className="text-[11px] text-slate-500">
                      Est. Housekeeping response:{' '}
                      <span className="text-emerald-600 font-medium">&lt; 6 mins</span>
                    </p>
                  </div>
                </div>

                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-500">
                  <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                    />
                  </svg>
                </div>
              </div>
            </header>

            {/* Hero Call Section */}
            <section className="my-auto py-4 flex flex-col items-center justify-center text-center relative">
              {isRippling && <div className="ripple-ring" />}

              <button
                onClick={() => triggerCall('Call Housekeeper', 'Housekeeping', 'Housekeeping Desk', 'High-priority instant chime from Room 304.')}
                className="touch-press animate-bell-pulse relative w-56 h-56 rounded-full bg-gradient-to-b from-[#DC5333] via-[#C84B31] to-[#A3341C] text-white flex flex-col items-center justify-center shadow-[0_20px_40px_-10px_rgba(184,60,31,0.45)] border-[3px] border-[#FF987A]/30 focus:outline-none select-none cursor-pointer"
              >
                <div className="relative mb-2">
                  <div className="w-14 h-12 flex items-center justify-center drop-shadow-md">
                    <svg
                      className="w-12 h-12 text-amber-200 fill-amber-200 drop-shadow-lg"
                      stroke="currentColor"
                      strokeWidth="1.2"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M12 2.5a1.25 1.25 0 011.25 1.25V4.2a7.5 7.5 0 016.25 7.4v2.4a2 2 0 00.7 1.5l.8.6a.75.75 0 01-.45 1.3H3.45a.75.75 0 01-.45-1.3l.8-.6a2 2 0 00.7-1.5v-2.4A7.5 7.5 0 0110.75 4.2V3.75A1.25 1.25 0 0112 2.5z"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                      />
                      <path d="M9 19.5a3 3 0 006 0" strokeLinecap="round" />
                    </svg>
                  </div>
                  <span className="absolute -top-1 -right-1 flex h-3 w-3">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-300 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-3 w-3 bg-amber-100"></span>
                  </span>
                </div>

                <span className="text-xl font-bold tracking-tight text-white drop-shadow-sm font-sans">
                  Call Housekeeper
                </span>

                <span className="mt-1 text-xs uppercase tracking-widest font-semibold text-amber-200/90 bg-black/20 px-3.5 py-0.5 rounded-full">
                  ROOM 304
                </span>

                <span className="text-[10px] text-white/70 font-light mt-1.5 tracking-wide">
                  Tap for instant chime
                </span>
              </button>

              <div className="mt-6 max-w-[280px]">
                <p className="text-xs text-slate-500 leading-relaxed font-normal">
                  Need towels, water, or immediate assistance? One tap alerts your Floor 3 captain on the staff terminal.
                </p>
                <p className="text-[11px] text-slate-400 font-medium mt-1">
                  Assigned to: <span className="text-slate-700 font-semibold">Attendant Ana &amp; Reception Desk</span>
                </p>
              </div>
            </section>

            {/* Quick Room Requests */}
            <section className="mt-1 mb-2">
              <div className="flex items-center justify-between mb-2 px-1">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500">
                  QUICK ROOM REQUESTS
                </h2>
                <span className="text-[11px] font-medium text-slate-600">
                  One-tap dispatch
                </span>
              </div>

              <div className="grid grid-cols-3 gap-2 pb-1">
                <button
                  onClick={() => triggerCall('Bottled Water', 'Room Service', 'Room Service Desk', '2x Still Bottled Waters requested.')}
                  className="touch-press flex items-center justify-center gap-1.5 py-2.5 px-2 bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-slate-300 text-xs font-semibold text-slate-800 focus:outline-none cursor-pointer"
                >
                  <span className="text-base leading-none">💧</span>
                  <span>Water</span>
                </button>

                <button
                  onClick={() => triggerCall('Fresh Towels', 'Housekeeping', 'Housekeeping Desk', 'Plush bath & face towels requested.')}
                  className="touch-press flex items-center justify-center gap-1.5 py-2.5 px-2 bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-slate-300 text-xs font-semibold text-slate-800 focus:outline-none cursor-pointer"
                >
                  <span className="text-base leading-none">🧖</span>
                  <span>Towels</span>
                </button>

                <button
                  onClick={() => triggerCall('Bill / Digital Key', 'Front Desk', 'Front Desk Reception', 'Folio summary and late checkout check requested.')}
                  className="touch-press flex items-center justify-center gap-1.5 py-2.5 px-2 bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-slate-300 text-xs font-semibold text-slate-800 focus:outline-none cursor-pointer"
                >
                  <span className="text-base leading-none">🧾</span>
                  <span>Bill / Key</span>
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2 mt-2">
                <button
                  onClick={() => triggerCall('AC / Tech Check', 'Maintenance', 'Engineering Tech', 'Thermostat, TV or Wi-Fi check requested in Room 304.')}
                  className="touch-press flex items-center justify-start gap-2.5 p-2.5 bg-slate-100/90 hover:bg-slate-200/80 rounded-xl border border-slate-200/80 text-left cursor-pointer"
                >
                  <span className="text-sm pl-1">🔧</span>
                  <div>
                    <div className="text-[11px] font-bold text-slate-800 leading-tight">
                      AC / Tech Check
                    </div>

                        {toast.title}

                      <span className="text-[10px] text-emerald-400 font-mono">Dispatched</span>

                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>

                        Floor 3 staff terminal ringing • <strong className="text-slate-200 font-semibold">ETA: 4-6 mins</strong>

            {/* Footer */}

              <div className="bg-[#FFFDF5] border border-amber-200/70 rounded-xl px-3 py-2 flex items-center justify-between shadow-xs">

                    <div className="text-[11px] font-bold text-slate-800 leading-tight">

                    <div className="text-[10px] text-slate-500">

                <a
                  href="tel:0"

    // -------------------------------------------------------------
    // STAFF DASHBOARD COMPONENT (Matches user request)
    // -------------------------------------------------------------
    function StaffView({
      requests,
      isStaffRinging,
      latestRingingRequest,
      onAcceptRequest,
      onStopRinging,
      onUpdateStatus,
      onAddNote,
      soundEnabled,
      setSoundEnabled,
      playChime,
      onSwitchToGuest
    }) {
      // Tabs: 'incoming' (unaccepted) | 'dispatched' (accepted/dispatch side) | 'completed'
      const [activeTab, setActiveTab] = useState('incoming');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [noteInputId, setNoteInputId] = useState(null);
      const [noteText, setNoteText] = useState('');

      const incomingRequests = useMemo(() => requests.filter(r => r.status === 'pending'), [requests]);
      const dispatchedRequests = useMemo(() => requests.filter(r => r.status === 'dispatched'), [requests]);
      const completedRequests = useMemo(() => requests.filter(r => r.status === 'completed'), [requests]);

      const activeList = useMemo(() => {
        let list = [];
        if (activeTab === 'incoming') list = incomingRequests;
        else if (activeTab === 'dispatched') list = dispatchedRequests;
        else if (activeTab === 'completed') list = completedRequests;

        return list.filter(req => {
          if (selectedCategory !== 'All' && req.category !== selectedCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!req.room.toLowerCase().includes(q) &&
                !req.serviceItem.toLowerCase().includes(q) &&
                !req.guestName.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [activeTab, incomingRequests, dispatchedRequests, completedRequests, selectedCategory, searchQuery]);

      const handleAccept = (reqId) => {
        // Stops ringing & moves request to dispatched side (removes from incoming!)
        onAcceptRequest(reqId, 'Attendant Ana');
        // Automatically switch to Dispatched side tab so it only shows there!
        setActiveTab('dispatched');
      };

      const handleNoteSubmit = (id) => {
        if (!noteText.trim()) return;
        onAddNote(id, noteText.trim());
        setNoteText('');
        setNoteInputId(null);
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-800 font-sans pb-12 selection:bg-blue-100">
          
          {/* Continuous Ringing Alarm Banner */}
          {isStaffRinging && (
            <div className="bg-red-600 text-white px-4 py-3 shadow-lg border-b-2 border-red-700 animate-pulse sticky top-0 z-50">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="text-2xl animate-bounce">🔔</span>
                  <div>
                    <h2 className="text-sm sm:text-base font-extrabold tracking-wide uppercase">
                      INCOMING GUEST CALL RINGING NOW!
                    </h2>
                    <p className="text-xs text-red-100">
                      {latestRingingRequest
                        ? `Room ${latestRingingRequest.room}: ${latestRingingRequest.serviceItem} — Ringing continuously until accepted!`
                        : 'Ringtone is actively ringing on staff side. Accept request to silence.'}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  {latestRingingRequest && (
                    <button
                      onClick={() => handleAccept(latestRingingRequest.id)}
                      className="px-4 py-1.5 rounded-lg bg-white text-red-700 hover:bg-red-50 text-xs font-bold shadow-md transition-transform active:scale-95 cursor-pointer"
                    >
                      ✓ Accept &amp; Silence Ringtone
                    </button>
                  )}
                  <button
                    onClick={onStopRinging}
                    className="px-3 py-1.5 rounded-lg bg-red-800 hover:bg-red-900 text-white text-xs font-semibold cursor-pointer"
                  >
                    Mute Alarm
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-[#0F2756] text-amber-200 flex items-center justify-center font-serif text-sm font-semibold shadow-sm border border-amber-300/30">
                  GA
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs uppercase tracking-widest font-bold text-slate-500">
                      THE GRAND AZURE
                    </span>
                    <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold border border-slate-200">
                      Floor 3 Terminal
                    </span>
                  </div>
                  <h1 className="text-sm sm:text-base font-bold text-[#0F2756] leading-none mt-0.5">
                    Staff Operations &amp; Guest Request Dispatch
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => {
                    const next = !soundEnabled;
                    setSoundEnabled(next);
                    if (next) playChime();
                  }}
                  className={`p-2 rounded-lg border text-xs font-medium flex items-center gap-1.5 transition-colors cursor-pointer ${
                    soundEnabled
                      ? 'bg-amber-50 border-amber-200 text-amber-900'
                      : 'bg-slate-100 border-slate-200 text-slate-400'
                  }`}
                  title="Toggle Staff Audio Ringtone"
                >
                  <span>{soundEnabled ? '🔔' : '🔕'}</span>
                  <span className="hidden md:inline">{soundEnabled ? 'Ringtone Ready' : 'Muted'}</span>
                </button>

                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-slate-500">Duty:</span>
                  <span className="font-semibold text-slate-800">Ana Morales (Captain)</span>
                </div>

                {onSwitchToGuest && (
                  <button
                    onClick={onSwitchToGuest}
                    className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-[#0F2756] hover:bg-[#1E3A8A] text-white text-xs font-semibold shadow-sm transition-all cursor-pointer"
                  >
                    <span>🛎️</span>
                    <span>Open Room 304</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Body */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            
            {/* Metric Cards */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6">
              <div
                onClick={() => setActiveTab('incoming')}
                className={`p-4 rounded-xl border shadow-xs flex items-center justify-between cursor-pointer transition-all ${
                  activeTab === 'incoming' ? 'ring-2 ring-red-400 bg-red-50/20 border-red-300' : 'bg-white border-slate-200'
                }`}
              >
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Incoming Calls (Unaccepted)
                  </p>
                  <h3 className="text-2xl font-bold text-red-600 mt-1 font-mono flex items-center gap-2">
                    {incomingRequests.length}
                    {isStaffRinging && <span className="inline-flex w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>}
                  </h3>
                  <p className="text-[11px] text-red-600 font-medium mt-0.5">
                    {isStaffRinging ? 'Ringing continuously!' : incomingRequests.length > 0 ? 'Needs acceptance' : 'Queue clear'}
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-lg border border-red-100">
                  🚨
                </div>
              </div>

              <div
                onClick={() => setActiveTab('dispatched')}
                className={`p-4 rounded-xl border shadow-xs flex items-center justify-between cursor-pointer transition-all ${
                  activeTab === 'dispatched' ? 'ring-2 ring-blue-500 bg-blue-50/20 border-blue-300' : 'bg-white border-slate-200'
                }`}
              >
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Dispatched Side (In Action)
                  </p>
                  <h3 className="text-2xl font-bold text-blue-600 mt-1 font-mono">
                    {dispatchedRequests.length}
                  </h3>
                  <p className="text-[11px] text-blue-500 font-medium mt-0.5">
                    Accepted &amp; in-flight
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg border border-blue-100">
                  🚀
                </div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Floor SLA Speed
                  </p>
                  <h3 className="text-2xl font-bold text-slate-900 mt-1 font-mono">
                    3.4m
                  </h3>
                  <p className="text-[11px] text-slate-500 font-medium mt-0.5">
                    Target: &lt; 6 mins
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg border border-amber-100">
                  ⚡
                </div>
              </div>

              <div
                onClick={() => setActiveTab('completed')}
                className={`p-4 rounded-xl border shadow-xs flex items-center justify-between cursor-pointer transition-all ${
                  activeTab === 'completed' ? 'ring-2 ring-emerald-500 bg-emerald-50/20 border-emerald-300' : 'bg-white border-slate-200'
                }`}
              >
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    Completed Side
                  </p>
                  <h3 className="text-2xl font-bold text-emerald-600 mt-1 font-mono">
                    {completedRequests.length}
                  </h3>
                  <p className="text-[11px] text-emerald-700 font-medium mt-0.5">
                    Delivered &amp; resolved
                  </p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg border border-emerald-100">
                  ✓
                </div>
              </div>
            </div>

            {/* Tab switchers: INCOMING vs DISPATCHED SIDE */}
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs mb-6 space-y-4">
              <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                <div className="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                  
                  {/* Tab 1: Incoming (Unaccepted) */}
                  <button
                    onClick={() => setActiveTab('incoming')}
                    className={`px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${
                      activeTab === 'incoming'
                        ? 'bg-red-600 text-white shadow-sm'
                        : 'text-slate-700 hover:text-slate-900'
                    }`}
                  >
                    <span>🚨 Incoming Requests</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                      activeTab === 'incoming' ? 'bg-white text-red-700' : 'bg-red-100 text-red-700'
                    }`}>
                      {incomingRequests.length}
                    </span>
                    {isStaffRinging && <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>}
                  </button>

                  {/* Tab 2: Dispatched Side (Only Accepted Requests Show Here!) */}
                  <button
                    onClick={() => setActiveTab('dispatched')}
                    className={`px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${
                      activeTab === 'dispatched'
                        ? 'bg-[#0F2756] text-white shadow-sm'
                        : 'text-slate-700 hover:text-slate-900'
                    }`}
                  >
                    <span>🚀 Dispatched Side</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                      activeTab === 'dispatched' ? 'bg-blue-400 text-slate-900' : 'bg-blue-100 text-blue-800'
                    }`}>
                      {dispatchedRequests.length}
                    </span>
                  </button>

                  {/* Tab 3: Completed */}
                  <button
                    onClick={() => setActiveTab('completed')}
                    className={`px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all cursor-pointer ${
                      activeTab === 'completed'
                        ? 'bg-emerald-600 text-white shadow-sm font-semibold'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>✓ Completed</span>
                    <span className={`px-1.5 py-0.5 rounded-full text-[10px] ${
                      activeTab === 'completed' ? 'bg-white text-emerald-800' : 'bg-slate-200 text-slate-700'
                    }`}>
                      {completedRequests.length}
                    </span>
                  </button>
                </div>

                <div className="relative flex-1 max-w-xs sm:max-w-sm">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
                    🔍
                  </span>
                  <input
                    type="text"
                    placeholder="Search Room, Item, or Guest..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0F2756]/20 focus:border-[#0F2756]"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 text-xs"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider shrink-0 mr-1">
                  Department:
                </span>
                {['All', 'Housekeeping', 'Room Service', 'Maintenance', 'Front Desk'].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3 py-1 rounded-full text-xs font-medium transition-colors shrink-0 cursor-pointer ${
                      selectedCategory === cat
                        ? 'bg-[#0F2756] text-white'
                        : 'bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200/80'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            {/* List */}
            <div className="space-y-3">
              <div className="flex items-center justify-between px-1">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500">
                  {activeTab === 'incoming' && '🚨 Incoming Queue (Unaccepted Calls — Ringing)'}
                  {activeTab === 'dispatched' && '🚀 Dispatched Side (Only Accepted Requests)'}
                  {activeTab === 'completed' && '✓ Completed History'}
                </h2>
                <span className="text-xs text-slate-400">
                  Showing {activeList.length} items
                </span>
              </div>

              {activeList.length === 0 ? (
                <div className="bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center">
                  <span className="text-4xl">
                    {activeTab === 'incoming' ? '🎉' : activeTab === 'dispatched' ? '📦' : '📜'}
                  </span>
                  <h4 className="text-sm font-bold text-slate-700 mt-2">
                    {activeTab === 'incoming' && 'No Incoming Requests'}
                    {activeTab === 'dispatched' && 'No Dispatched Requests Yet'}
                    {activeTab === 'completed' && 'No Completed Requests'}
                  </h4>
                  <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">

                  </p>
                </div>
              ) : (
                activeList.map(req => {
                  const isPending = req.status === 'pending';
                  const isDispatched = req.status === 'dispatched';
                  const isCompleted = req.status === 'completed';

                  return (
                    <div
                      key={req.id}
                      className={`bg-white rounded-xl border p-4 sm:p-5 transition-all shadow-xs ${
                        isPending
                          ? 'border-red-400 bg-red-50/15 ring-2 ring-red-200'
                          : isDispatched

                    >

                                className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-xs transition-colors cursor-pointer"
                              >
                                ✓ Mark Completed
                              </button>
                            )}

                            {isCompleted && (
                              <button
                                onClick={() => onUpdateStatus(req.id, 'dispatched', 'Attendant Ana')}
                                className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium cursor-pointer"
                              >
                                Re-dispatch
                              </button>
                            )}

                            <button
                              onClick={() => setNoteInputId(noteInputId === req.id ? null : req.id)}
                              className="px-2 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 text-xs hover:bg-slate-100 cursor-pointer"
                              title="Add note"
                            >
                              💬
                            </button>
                          </div>
                        </div>
                      </div>

                      {noteInputId === req.id && (
                        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2">
                          <input
                            type="text"
                            placeholder="Add attendant note..."
                            value={noteText}
                            onChange={e => setNoteText(e.target.value)}
                            className="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#0F2756]"
                            onKeyDown={e => {
                              if (e.key === 'Enter') handleNoteSubmit(req.id);
                            }}
                          />
                          <button
                            onClick={() => handleNoteSubmit(req.id)}
                            className="px-3 py-1.5 bg-[#0F2756] text-white text-xs font-semibold rounded-lg hover:bg-[#1E3A8A] cursor-pointer"
                          >
                            Save
                          </button>
                          <button
                            onClick={() => setNoteInputId(null)}
                            className="px-2 py-1.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer"
                          >
                            Cancel
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
